name: Persona CI (Fast Quality Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-quality-gate:
    name: Fast PR Validation (< 10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        # actions/checkout@v4 (pinned to immutable commit SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        # actions/setup-java@v4 (pinned to immutable commit SHA)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4 (pinned to immutable commit SHA)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run Machine Security Static Analysis
        run: bash scripts/security-check.sh

      - name: Assemble Debug Variant
        run: bash gradlew assembleDebug --stacktrace

      - name: Run All Module Unit Tests (M1 - M6)
        run: bash gradlew testDebugUnitTest

      - name: Run Android Lint
        run: bash gradlew lintDebug

      - name: Upload Lint Results
        if: always()
        # actions/upload-artifact@v4 (pinned to immutable commit SHA)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
