name: Persona CI (Fast Quality Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-quality-gate:
    name: Fast PR Validation (< 10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        # actions/checkout@v4 (pinned to immutable commit SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        # actions/setup-java@v4 (pinned to immutable commit SHA)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4 (pinned to immutable commit SHA)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Run Machine Security Static Analysis
        run: bash scripts/security-check.sh

      - name: Assemble Debug Variant
        run: bash gradlew assembleDebug --stacktrace

      - name: Run All Module Unit Tests (M1 - M6)
        run: bash gradlew testDebugUnitTest

      - name: Run Android Lint
        run: bash gradlew lintDebug

      - name: Upload Lint Results
        if: always()
        # actions/upload-artifact@v4 (pinned to immutable commit SHA)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
