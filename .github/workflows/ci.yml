name: Persona CI (Fast Quality Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-quality-gate:
    name: Fast PR Validation (< 10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        # actions/checkout@v4 (pinned to immutable commit SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        # actions/setup-java@v4 (pinned to immutable commit SHA)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4 (pinned to immutable commit SHA)
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Run Machine Security Static Analysis
        run: bash scripts/security-check.sh

      - name: Assemble Debug Variant
        run: bash gradlew assembleDebug --stacktrace

      - name: Run All Module Unit Tests (M1 - M6)
        run: bash gradlew testDebugUnitTest

      - name: Run Android Lint
        run: bash gradlew lintDebug

      - name: Upload Lint Results
        if: always()
        # actions/upload-artifact@v4 (pinned to immutable commit SHA)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
