name: Persona Security CI (Adversarial & Crypto Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Nightly run at 2 AM UTC

jobs:
  security-verification:
    name: Cryptographic & Adversarial Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        # actions/checkout@v4.1.7 (pinned to immutable commit SHA)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up JDK 17
        # actions/setup-java@v4.2.2 (pinned to immutable commit SHA)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Static Security Scan (Hardcoded Secrets & Permissions)
        run: bash scripts/security-check.sh

      - name: Execute RFC 6238 TOTP Test Vectors
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.vault.TotpRfc6238Tests"

      - name: Execute Zone 4 15 Adversarial Attack Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.vault.VaultAdversarialAttackTests"

      - name: Execute Sharing Protocol & Replay Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.sharing.SharingProtocolTests"

      - name: Execute Cross-Zone Isolation Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.integration.CrossZoneIsolationAttackTests"

      - name: Execute Full Lifecycle Journey Integration Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.integration.FullLifecycleE2ETests"

      - name: Execute Disaster Recovery & Clock Manipulation Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.integration.DisasterRecoveryAndClockTests"

      - name: Execute Room Schema Migration Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.data.local.RoomMigrationTests"

      - name: Execute Milestone 8 Backup & Disaster Recovery Adversarial Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.backup.BackupAdversarialTests"

      - name: Execute Milestone 8-RC Destructive Recovery & Crash Transition Tests
        run: bash gradlew testDebugUnitTest --tests "com.pims.vault.backup.M8RCDestructiveRecoveryTests"
